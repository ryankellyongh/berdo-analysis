# Keeps the Streamlit Community Cloud app from hibernating by visiting it
# in a real (headless) browser every 6 hours, and clicking the wake-up
# button if it has already gone to sleep.
#
# Save as: .github/workflows/keep-awake.yml
# Then set APP_URL below to your app's address.

name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); the minute is offset to avoid peak load
  workflow_dispatch:          # lets you run it by hand from the Actions tab

env:
  APP_URL: "https://berdo-priority-screening-tool.streamlit.app/"

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(10_000)

              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count() > 0:
                  print("App was asleep; waking it.")
                  wake.first.click()
                  page.wait_for_timeout(90_000)   # cold start can take a minute or two
              else:
                  print("App was awake.")
                  page.wait_for_timeout(20_000)   # stay long enough to count as a session

              print("Page title:", page.title())
              browser.close()
          PY
